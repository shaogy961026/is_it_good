<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首頁</title>
    <script src="shared-nav.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: var(--clr-bg, #F8FAFC);
        }

        /* ── 歡迎區塊 ─────────────────── */
        .welcome-container {
            max-width: 860px;
            margin: 50px auto 0 auto;
            text-align: center;
            background: var(--clr-card, #fff);
            padding: 40px 30px 30px;
            border-radius: var(--radius-lg, 14px);
            box-shadow: var(--shadow-card, 0 2px 8px rgba(0,0,0,0.06));
            border: 1px solid var(--clr-border, #e2e8f0);
        }
        .welcome-container h1 {
            color: var(--clr-primary, #1E40AF);
            margin-bottom: 14px;
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        .welcome-container p {
            color: var(--clr-text-muted, #64748b);
            line-height: 1.85;
            font-size: 15px;
            margin: 0;
        }
        .welcome-container strong { color: var(--clr-text, #1e293b); }

        /* ── 工具列表區 ───────────────── */
        #tool-list-section {
            max-width: 860px;
            margin: 32px auto 70px auto;
        }

        .category-block {
            margin-bottom: 32px;
        }
        .category-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--clr-text-light, #94a3b8);
            letter-spacing: 0.10em;
            text-transform: uppercase;
            border-bottom: 1.5px solid var(--clr-border, #e2e8f0);
            padding-bottom: 9px;
            margin-bottom: 16px;
        }

        .tool-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 14px;
        }

        .tool-card {
            display: block;
            background: var(--clr-card, #fff);
            border: 1.5px solid var(--clr-border, #e2e8f0);
            border-radius: var(--radius-lg, 12px);
            padding: 18px 20px;
            text-decoration: none;
            color: inherit;
            transition: box-shadow 0.2s ease, border-color 0.2s ease, transform 0.18s ease;
            cursor: pointer;
        }
        .tool-card:hover {
            box-shadow: var(--shadow-card-hover, 0 6px 20px rgba(30,64,175,0.14));
            border-color: var(--clr-secondary, #3B82F6);
            transform: translateY(-3px);
        }

        .tool-card-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--clr-text, #1e293b);
            margin-bottom: 9px;
            display: flex;
            align-items: center;
            gap: 6px;
            line-height: 1.4;
        }
        .tool-card-title::after {
            content: "→";
            font-size: 0.85rem;
            color: var(--clr-primary, #1E40AF);
            margin-left: auto;
            opacity: 0;
            transition: opacity 0.18s, transform 0.18s;
        }
        .tool-card:hover .tool-card-title::after {
            opacity: 1;
            transform: translateX(3px);
        }

        .tool-card-bullets {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .tool-card-bullets li {
            font-size: 0.82rem;
            color: var(--clr-text-muted, #64748b);
            padding: 2px 0;
            padding-left: 14px;
            position: relative;
            line-height: 1.6;
        }
        .tool-card-bullets li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--clr-secondary, #3B82F6);
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .welcome-container { margin: 20px 14px 0; padding: 28px 18px; }
            #tool-list-section  { margin: 22px 14px 50px; }
            .tool-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="global-nav"></div>

    <div class="welcome-container">
        <h1>歡迎來到 數位楓水研究室</h1>
        <p>提供新楓之谷數據分析與機率計算。<br>從下方選擇工具，或使用<strong>上方選單</strong>前往。</p>
    </div>

    <div id="tool-list-section"></div>

    <script src="shared-subtitle.js"></script>
    <script>
        (function () {
            var section = document.getElementById('tool-list-section');
            if (!section || typeof TOOL_CATEGORIES === 'undefined') return;

            TOOL_CATEGORIES.forEach(function (cat) {
                var block = document.createElement('div');
                block.className = 'category-block';

                var catTitle = document.createElement('div');
                catTitle.className = 'category-title';
                catTitle.textContent = cat.name;
                block.appendChild(catTitle);

                var grid = document.createElement('div');
                grid.className = 'tool-grid';

                cat.ids.forEach(function (id) {
                    var info = TOOL_INFO[id];
                    if (!info) return;

                    var card = document.createElement('a');
                    card.className = 'tool-card';
                    card.href = './' + id + '/';

                    var titleEl = document.createElement('div');
                    titleEl.className = 'tool-card-title';
                    titleEl.textContent = info.title;
                    card.appendChild(titleEl);

                    var ul = document.createElement('ul');
                    ul.className = 'tool-card-bullets';
                    info.bullets.forEach(function (text) {
                        var li = document.createElement('li');
                        li.textContent = text;
                        ul.appendChild(li);
                    });
                    card.appendChild(ul);

                    grid.appendChild(card);
                });

                block.appendChild(grid);
                section.appendChild(block);
            });
        })();
    </script>
</body>
</html>
